<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta
			name="description"
			content="Practice HSK 1–5 Chinese vocabulary. Tone-marked pinyin, quizzing in both directions, and short sessions weighted toward the words you keep missing."
		/>
		<meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)" />
		<meta name="theme-color" content="#100f0e" media="(prefers-color-scheme: dark)" />
		<meta property="og:type" content="website" />
		<meta property="og:title" content="hskquiz — HSK 1–5 vocabulary practice" />
		<meta
			property="og:description"
			content="Short, spaced practice sessions over the official HSK 3.0 word list."
		/>
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2264%22%20height%3D%2264%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2215%22%20fill%3D%22%23c8102e%22%2F%3E%3Ctext%20x%3D%2232%22%20y%3D%2247%22%20text-anchor%3D%22middle%22%20font-size%3D%2246%22%20font-family%3D%22PingFang%20SC%2CHiragino%20Sans%20GB%2CNoto%20Sans%20SC%2CMicrosoft%20YaHei%2Csans-serif%22%20fill%3D%22%23fff%22%3E%E6%B1%89%3C%2Ftext%3E%3C%2Fsvg%3E"
		/>
		<!-- Painted before the bundle lands so the first frame is already the right colour and
		     the body never shifts by the UA's default 8px margin. -->
		<style>
			:root {
				color-scheme: light dark;
				background-color: #faf8f5;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					background-color: #100f0e;
				}
			}
			body {
				margin: 0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
